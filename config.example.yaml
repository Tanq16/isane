server:
  bind: 0.0.0.0:8080
  public_url: https://chat.example.com
  insecure: false

database:
  url: postgres://chat:PASSWORD@postgres:5432/chat?sslmode=disable

push:
  vapid_public_key: BN...
  vapid_private_key: ...
  subject: mailto:admin@example.com

livekit:
  public_url: wss://chat.example.com/livekit
  internal_url: http://livekit:7880
  api_key: isane
  api_secret: ...

media:
  root: /media
  max_upload_bytes: 104857600
  image_max_dimension: 2560

retention:
  message_days: 0
  recording_days: 90
  staged_upload_hours: 24

agents:
  job_timeout: 5m

media_quality:
  video:
    max_resolution: 720
    max_bitrate: 1700000
    max_framerate: 30
    simulcast_layers:
      - {height: 180, bitrate: 160000}
      - {height: 360, bitrate: 450000}
  screen_share:
    max_resolution: 1080
    max_bitrate: 2500000
    max_framerate: 15
  audio:
    max_bitrate: 48000
    dtx: true
  codec: vp8
