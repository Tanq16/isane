port: 7880

keys:
  isane: REPLACE_ME_openssl_rand_base64_32

redis:
  address: 127.0.0.1:6379

rtc:
  port_range_start: 50000
  port_range_end: 50200
  tcp_port: 7881
  # Leaving use_external_ip true makes LiveKit STUN twilio.com and google.com on
  # every start to discover an address the deployer already knows.
  use_external_ip: false
  # Compose supplies this as NODE_IP from PUBLIC_IP in .env, which overrides it.
  # node_ip: 203.0.113.10
  # Egress runs on this same host and cannot reach node_ip where the provider does
  # not hairpin its own public address, so the private address is offered too.
  advertise_internal_ip: true
  ips:
    # Without this LiveKit offers every Docker bridge on the host as an ICE candidate.
    # An includes list drops every address outside it, so replace this with the subnet
    # of this host's own private interface.
    includes: ["10.0.1.0/24"]

turn:
  enabled: true
  udp_port: 3478
  # Raising tls_port off 0 also requires turn.domain and a certificate for it.
  tls_port: 0
  # These ports carry TURN relay traffic and must stay open in the firewall. LiveKit
  # runs on the host network, so compose publishes none of its ports.
  relay_range_start: 50201
  relay_range_end: 50300

room:
  empty_timeout: 300
  departure_timeout: 20
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8

webhook:
  api_key: isane
  urls:
    - http://127.0.0.1:8080/api/livekit/webhook

logging:
  level: info
