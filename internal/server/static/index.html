<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Isane</title>

    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/static/manifest.json">

    <meta name="theme-color" content="#11111b">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Isane">

    <link rel="stylesheet" href="/static/css/app.css">

    <script src="/static/js/boot.js"></script>

    <script defer src="/static/vendor/marked.min.js"></script>
    <script defer src="/static/vendor/highlight.min.js"></script>
    <script defer src="/static/vendor/mermaid.min.js"></script>
    <script defer src="/static/vendor/livekit-client.umd.min.js"></script>
    <script defer src="/static/vendor/lucide.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
</head>
<body class="flex h-dvh flex-col overflow-hidden bg-crust font-sans text-subtext0 antialiased">

<div id="push-banner" class="hidden shrink-0 items-center gap-3 bg-base px-4 py-2 text-sm">
    <p class="min-w-0 flex-1 text-subtext0">Turn on notifications to hear about mentions and messages while Isane is closed.</p>
    <button id="push-banner-enable" type="button" class="shrink-0 rounded-lg bg-mauve px-3 py-1.5 text-sm font-semibold text-crust transition-colors hover:brightness-110">Enable</button>
    <button id="push-banner-dismiss" type="button" class="shrink-0 rounded-lg px-3 py-1.5 text-sm text-overlay1 transition-colors hover:text-text">Not now</button>
</div>

<div id="app" class="group flex min-h-0 flex-1" data-drawer="closed" data-sidebar="open">
    <div id="drawer-scrim" class="fixed inset-0 z-40 hidden bg-scrim backdrop-blur-sm group-data-[drawer=open]:block md:hidden"></div>

    <aside id="sidebar" aria-label="Channels and conversations"
        class="fixed inset-y-0 left-0 z-50 w-72 shrink-0 -translate-x-full overflow-hidden bg-crust transition-transform duration-200 ease-out group-data-[drawer=open]:translate-x-0 md:static md:z-auto md:w-[var(--sidebar-width)] md:translate-x-0 md:transition-none"></aside>

    <div id="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="Resize the channel list" tabindex="0"
        class="hidden w-1 shrink-0 cursor-col-resize bg-transparent transition-colors hover:bg-surface0 focus-visible:bg-mauve focus-visible:outline-none md:group-data-[sidebar=open]:block"></div>

    <main id="main" class="flex min-w-0 flex-1 flex-col bg-mantle">
        <header id="timeline-header" class="flex h-12 w-full min-w-0 shrink-0 items-center gap-2 border-b border-surface0 px-4"></header>
        <div id="timeline" class="relative min-h-0 flex-1 overflow-y-auto overscroll-contain"></div>
        <div id="composer" class="shrink-0"></div>
    </main>

    <section id="thread-pane" role="dialog" aria-label="Thread"
        class="hidden fixed inset-0 z-30 overflow-hidden bg-mantle xl:static xl:z-auto xl:w-[380px] xl:shrink-0 xl:border-l xl:border-surface0"></section>

    <section id="call-pane" role="dialog" aria-label="Call"
        class="hidden fixed inset-0 z-30 overflow-hidden bg-crust xl:static xl:z-auto xl:w-[380px] xl:shrink-0"></section>
</div>

<div id="admin-root" class="hidden min-h-0 flex-1 overflow-hidden bg-crust"></div>

<div id="login-root" class="hidden min-h-0 flex-1 items-center justify-center overflow-y-auto bg-crust p-4"></div>

<div id="toast-root" aria-live="polite"
    class="pointer-events-none fixed bottom-0 right-0 z-50 flex flex-col items-end gap-2 p-4 empty:hidden"></div>

<div id="modal-root" class="fixed inset-0 z-50 empty:hidden"></div>

<div id="install-hint" class="hidden fixed inset-x-4 bottom-4 z-40 mx-auto max-w-md rounded-xl bg-base p-4 text-sm shadow-pop">
    <p class="mb-1 font-medium text-text">Add Isane to your home screen</p>
    <p class="mb-3 text-subtext0">Tap Share in Safari, then Add to Home Screen. Notifications only work from the home screen app.</p>
    <button id="install-hint-dismiss" type="button" class="rounded-lg bg-surface0 px-3 py-1.5 font-medium text-text transition-colors hover:bg-surface1">Got it</button>
</div>

</body>
</html>
